name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q skills
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Validate JSON files
        run: |
          python - <<'EOF'
          import json, pathlib, sys
          paths = list(pathlib.Path(".").glob("*.json"))
          paths += list(pathlib.Path(".zcode-plugin").glob("*.json"))
          paths += list(pathlib.Path("skills").rglob("*.json"))
          for p in paths:
              json.load(open(p, encoding="utf-8"))
              print("ok", p)
          sys.exit(0)
          EOF
      - name: Smoke test project slug script
        run: |
          python -c "import subprocess,sys; out=subprocess.run([sys.executable,'skills/_shared/project_id.py','.'],capture_output=True,text=True).stdout.strip(); assert '-' in out and len(out.rsplit('-',1)[-1])==6, out; print('slug ok:',out)"
